services:
  - type: web
    name: efa-api
    env: node
    rootDir: apps/api
    plan: free
    buildCommand: pnpm i --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"

  - type: web
    name: efa-web
    env: static
    rootDir: apps/web
    plan: free
    buildCommand: pnpm i --frozen-lockfile=false && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false