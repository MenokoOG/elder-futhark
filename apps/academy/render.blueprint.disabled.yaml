services:
- type: web
  name: efa-api
  runtime: node
  plan: free
  region: oregon
  rootDir: server
  buildCommand: pnpm install --frozen-lockfile=false
  startCommand: pnpm start
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "10000"
  - key: MONGODB_URI
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: JWT_EXPIRES_IN
    value: "7d"
  - key: CLIENT_ORIGIN
    sync: false

- type: web
  name: efa-web
  env: static
  plan: free
  region: oregon
  rootDir: client
  buildCommand: pnpm install --frozen-lockfile=false && pnpm build
  publishPath: dist
  envVars:
  - key: VITE_API_BASE_URL
    sync: false
